    <link rel="stylesheet" href="logout.css">
  <link rel="stylesheet" href="site-common.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="dashboard-header">        <div class="school-name">CRESENT HIGH SCHOOL</div>
        <nav class="dashboard-nav">
            <a href="dashboard.html">Dashboard</a>
            
            <a href="academic.html">Academics</a>

        </nav>
    </header>
    <main class="logout-main">
        <section class="logout-section">
            <h2>You have been logged out</h2>
            <p>Thank you for using the CRESENT HIGH SCHOOL Student Portal.</p>
            <a href="index.html" class="login-btn" id="logoutBtn">Login Again</a>
        </section>
    </main>
        <footer class="dashboard-footer">
                        &copy; 2025 CRESENT HIGH SCHOOL. All rights reserved.
        </footer>
        <script>
        // Clear session and redirect to login on logout
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.removeItem('authToken');
            localStorage.removeItem('authUser');
            window.location.href = 'index.html';
        });
        </script>
  <script src="site-common.js"></script>
  <script src="shared-bindings.js"></script>
</body>
