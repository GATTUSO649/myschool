<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Teacher Login | CRESENT HIGH SCHOOL</title><link rel="stylesheet" href="site-common.css"><style>.teacher-login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(135deg,#123d45,#0f766e)}.teacher-card{width:min(420px,100%);padding:2rem;background:#fff;box-shadow:0 18px 45px #06262d66}.teacher-card h1{margin-top:0}.teacher-card form{display:grid;gap:1rem}.teacher-card label{display:grid;gap:.35rem}.teacher-card input{padding:.8rem;border:1px solid #cbd5e1}.teacher-card button{padding:.85rem;background:#0f766e;color:#fff;border:0;cursor:pointer}.teacher-card a{color:#0f766e}</style>  <link rel="stylesheet" href="responsive.css">
