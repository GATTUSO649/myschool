<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin Portal</title>
  <link rel="stylesheet" href="site-common.css">`n<link rel="stylesheet" href="dashboard.css">`n<link rel="stylesheet" href="admin-dashboard.css">
</head>
<body class="admin-dashboard-page has-site-footer">
  <header class="dashboard-header">
    <div class="header-content">
      <div style="display:flex;align-items:center;gap:14px">
        <button id="sidebarToggle" class="header-pill" title="Toggle sidebar">☰</button>
        <div class="brand-bar">
          <div class="school-name"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</div>
          <div class="header-note">Administration settings</div>
        </div>
      </div>
      <div class="header-actions">
        <input id="adminSearch" placeholder="Search settings" style="min-width:260px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff">
        <span class="header-pill" id="adminNamePill">Administrator</span>
        <button class="logout-button" data-admin-logout>Logout</button>
      </div>
    </div>
  </header>

  <div class="student-shell">
    <aside class="student-sidebar">
      <div class="sidebar-brand">Admin Control</div>
      <nav class="sidebar-section">
        <a class="sidebar-link" href="admin-dashboard.html">Overview</a>
        <a class="sidebar-link" href="admin-applications.html">Applications</a>
        <a class="sidebar-link" href="admin-students.html">Students</a>
        <a class="sidebar-link" href="admin-academics.html">Academics</a>
        <a class="sidebar-link" href="admin-uploads.html">Uploads</a>
        <a class="sidebar-link" href="admin-finance.html">Finance</a>
        <a class="sidebar-link active" href="admin-settings.html">Settings</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <section class="admin-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Settings</p>
            <h2>Administration settings</h2>
          </div>
          <button class="primary-button" data-admin-action="save-settings">Save</button>
        </div>
        <div class="dashboard-panel">
          <div class="panel-header"><h3>General school settings</h3><span class="panel-pill">Theme / academic year</span></div>
          <form class="admin-form admin-settings-form">
            <div class="form-row">
              <label>School name<input name="schoolName" value="Cresent High School"></label>
              <label>Academic year<input name="academicYear" value="2026"></label>
            </div>
            <div class="form-row">
              <label>Current term<input name="currentTerm" value="Term 1"></label>
              <label>System theme<input name="systemTheme" value="Modern Blue"></label>
            </div>
            <label class="settings-toggle">
              <input type="checkbox" name="maintenanceMode">
              <span>
                <strong>Maintenance mode</strong>
                <small>When saved, student portal pages show a maintenance message until this is unchecked.</small>
              </span>
            </label>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="admin-modern.js"></script>
  <script src="admin-dashboard.js"></script>
  <footer class="dashboard-footer">© 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>`n  <script src="shared-bindings.js"></script>
</body>
</html>
