<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Document Viewer - CRESENT</title>
  <link rel="stylesheet" href="/styles/shared/site-common.css">
  <style>
    body{font-family:Segoe UI,Arial,Helvetica,sans-serif;margin:0;padding:0;}
    .viewer-shell{max-width:900px;margin:28px auto;background:#fff;border-radius:8px;box-shadow:0 8px 30px rgba(20,20,40,0.08);overflow:hidden}
    .viewer-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef2f7}
    .viewer-title{font-size:18px;font-weight:700}
    .viewer-meta{color:#666;font-size:13px}
    .viewer-actions button{margin-left:8px;padding:8px 12px;border-radius:6px;border:0;cursor:pointer}
    .btn-primary{background:#1565c0;color:#fff}
    .btn-outline{background:#fff;border:1px solid #d1d7e0;color:#1a3a52}
    .viewer-body{padding:20px}
    .document-frame{width:100%;height:720px;border:1px solid #e6eef6;border-radius:6px}
    .doc-notice{margin-top:12px;color:#444}
  </style>
  <link rel="stylesheet" href="/styles/shared/responsive.css">
</head>
<body>
  <div class="viewer-shell">
    <div class="viewer-header">
      <div>
        <div class="viewer-title" id="docTitle">Document</div>
        <div class="viewer-meta" id="docMeta">&nbsp;</div>
      </div>
      <div class="viewer-actions">
        <button class="btn-outline" id="openRawBtn">Open Raw</button>
        <button class="btn-primary" id="downloadBtn">Download</button>
        <button class="btn-outline" id="printBtn">Print</button>
      </div>
    </div>
    <div class="viewer-body">
      <div id="docContainer">
        <!-- embed or preview will go here -->
      </div>
      <div class="doc-notice">If the document does not preview, use "Open Raw" to open the file in a new tab, or click "Download" to save a local copy.</div>
    </div>
  </div>

  <script>
    function qs(name){
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    const filename = qs('filename');
    const title = qs('title') || filename;
    const type = qs('type') || '';
    const API_BASE = (typeof CONFIG !== 'undefined' && CONFIG.API_URL) ? CONFIG.API_URL.replace(/\/api\/?$/,'') : window.location.origin;

    document.getElementById('docTitle').textContent = decodeURIComponent(title || filename || 'Document');
    document.getElementById('docMeta').textContent = filename ? `File: ${decodeURIComponent(filename)}` : '';

    const fileUrl = filename ? `${API_BASE}/api/finance/files/${encodeURIComponent(decodeURIComponent(filename))}` : null;

    const container = document.getElementById('docContainer');
    if(fileUrl){
      // decide best preview
      const lower = filename.toLowerCase();
      if(lower.endsWith('.pdf')){
        const embed = document.createElement('embed');
        embed.src = fileUrl;
        embed.type = 'application/pdf';
        embed.className = 'document-frame';
        container.appendChild(embed);
      } else if(lower.match(/\.(png|jpe?g|gif|webp|avif)$/)){
        const img = document.createElement('img');
        img.src = fileUrl;
        img.alt = title;
        img.className = 'document-preview-image';
        container.appendChild(img);
      } else if(lower.endsWith('.html') || lower.endsWith('.htm')){
        const iframe = document.createElement('iframe');
        iframe.src = fileUrl;
        iframe.className = 'document-frame';
        container.appendChild(iframe);
      } else {
        // for unknown types show iframe and fallback link
        const iframe = document.createElement('iframe');
        iframe.src = fileUrl;
        iframe.className = 'document-frame';
        container.appendChild(iframe);
      }

      document.getElementById('openRawBtn').addEventListener('click', ()=> window.open(fileUrl, '_blank'));
      document.getElementById('downloadBtn').addEventListener('click', ()=>{
        // navigate to file endpoint which forces download in many browsers
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = decodeURIComponent(filename);
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
      document.getElementById('printBtn').addEventListener('click', ()=>{
        // open a printable window for PDFs/images
        window.open(fileUrl, '_blank');
      });
    } else {
      container.innerHTML = '<p class="text-error">No file specified.</p>';
      document.getElementById('openRawBtn').disabled = true;
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('printBtn').disabled = true;
    }
  </script>
  <script src="/scripts/shared/shared-bindings.js"></script>
</body>
</html>
