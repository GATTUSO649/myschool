<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Receipt - CRESENT HIGH SCHOOL</title>
  <link rel="stylesheet" href="/styles/shared/site-common.css">
  <link rel="stylesheet" href="/styles/student/dashboard.css">
  <link rel="stylesheet" href="/styles/finance/finance.css">
  <link rel="stylesheet" href="/styles/shared/responsive.css">
</head>
<body class="student-portal has-site-footer">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="brand-bar">
        <div class="school-name"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</div>
        <div class="header-note">Payment receipt</div>
      </div>
      <div class="header-actions">
        <button class="logout-button" data-admin-logout>Logout</button>
      </div>
    </div>
  </header>

  <div class="student-shell">
    <aside class="student-sidebar">
      <div class="sidebar-brand">My Portal</div>
      <div class="sidebar-section">
        <h3>Main</h3>
        <a class="sidebar-link" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" href="finance.html">Finance</a>
      </div>
      <div class="sidebar-section">
        <h3>Finance</h3>
        <a class="sidebar-link" href="feestatement.html">Statements</a>
        <a class="sidebar-link active" href="paymentreceipts.html">Receipts</a>
      </div>
    </aside>

    <main class="dashboard-main finance-page">
      <section class="finance-hero">
        <div>
          <p class="eyebrow">Receipt</p>
          <h1>Payment Receipt</h1>
          <p>Official payment record generated from the finance ledger.</p>
        </div>
        <span class="finance-status is-cleared">Verified</span>
      </section>

      <section class="finance-panel">
        <div id="receiptContainer" class="receipt-document">
          <div class="empty-card">Loading receipt...</div>
        </div>
        <div class="panel-actions">
          <button class="panel-link" type="button" id="printBtn">Print</button>
          <a id="downloadLink" class="panel-link" href="#">Download</a>
        </div>
      </section>
    </main>
  </div>

  <footer class="dashboard-footer">© 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>

  <script src="/scripts/shared/config.js"></script>
  <script src="/scripts/auth/auth.js"></script>
  <script>
    function formatMoney(amount) {
      return `KSh ${Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
    }

    async function fetchReceiptById(receiptId) {
      const response = await fetchWithAuth('/finance/payments');
      if (!response.ok) throw new Error('Failed to fetch receipts');
      const receipts = await response.json();
      return receipts.find((receipt) => String(receipt.id) === String(receiptId));
    }

    async function renderReceipt() {
      const params = new URLSearchParams(window.location.search || '');
      const receiptId = params.get('receiptId') || params.get('id');
      const container = document.getElementById('receiptContainer');
      if (!receiptId) {
        container.innerHTML = '<div class="empty-card">No receipt was selected.</div>';
        return;
      }

      try {
        const receipt = await fetchReceiptById(receiptId);
        if (!receipt) {
          container.innerHTML = '<div class="empty-card">Receipt not found.</div>';
          return;
        }

        container.innerHTML = `
          <div class="receipt-sheet">
            <div class="receipt-school">
              <h2>CRESENT HIGH SCHOOL</h2>
              <p>Official Payment Receipt</p>
            </div>
            <div class="receipt-lines">
              <div><span>Receipt No.</span><strong>${receipt.receipt_number || receipt.id}</strong></div>
              <div><span>Student</span><strong>${receipt.student_name || '-'}</strong></div>
              <div><span>Admission No.</span><strong>${receipt.admission_number || '-'}</strong></div>
              <div><span>Amount</span><strong>${formatMoney(receipt.amount)}</strong></div>
              <div><span>Date</span><strong>${new Date(receipt.payment_date || receipt.created_at).toLocaleString()}</strong></div>
              <div><span>Method</span><strong>${receipt.payment_method || 'N/A'}</strong></div>
              <div><span>Reference</span><strong>${receipt.reference || 'N/A'}</strong></div>
              <div><span>Description</span><strong>${receipt.description || 'School fees payment'}</strong></div>
            </div>
          </div>
        `;

        document.getElementById('downloadLink').href = `${getApiUrl()}/finance/payments/${receipt.id}/download`;
      } catch (error) {
        console.error('Receipt load failed:', error);
        container.innerHTML = '<div class="empty-card">Unable to load receipt.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('printBtn').addEventListener('click', () => window.print());
      renderReceipt();
    });
  </script>
  <script src="/scripts/shared/site-common.js"></script>
  <script src="/scripts/shared/shared-bindings.js"></script>
</body>
</html>
