<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Database - Admin Portal</title>
  <link rel="stylesheet" href="/styles/shared/site-common.css">`n<link rel="stylesheet" href="/styles/student/dashboard.css">`n<link rel="stylesheet" href="/styles/admin/admin-dashboard.css">
  <link rel="stylesheet" href="/styles/shared/responsive.css">
</head>
<body class="admin-dashboard-page has-site-footer">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="brand-bar">
        <div class="school-name"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</div>
        <div class="header-note">Database control</div>
      </div>
      <div class="header-actions">
        <span class="header-pill" id="adminNamePill">Administrator</span>
        <button class="logout-button" data-admin-logout>Logout</button>
      </div>
    </div>
  </header>

  <div class="student-shell">
    <aside class="student-sidebar"></aside>
    <main class="dashboard-main">
      <section class="admin-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Database</p>
            <h2 id="databaseName">Database</h2>
          </div>
        </div>

        <div class="section-grid database-grid">
          <div class="dashboard-panel">
            <div class="panel-header">
              <h3>Tables</h3>
              <span class="panel-pill">Available</span>
            </div>
            <div class="database-table-list" id="databaseTableList"></div>
          </div>

          <div class="dashboard-panel">
            <div class="panel-header">
              <h3 id="databasePreviewTitle">Table preview</h3>
              <span class="panel-pill" id="databasePreviewMeta">Select a table</span>
            </div>
            <form id="databaseRecordForm" class="database-record-form hidden">
              <div class="database-record-grid" id="databaseRecordFields"></div>
              <div class="form-actions">
                <button class="primary-button" type="submit" id="databaseRecordSubmit">Save record</button>
                <button class="secondary-button" type="button" id="databaseRecordCancel">Cancel</button>
              </div>
            </form>
            <div id="databasePreview" class="database-output">
              <div class="empty-chart">Choose a table to preview its first rows.</div>
            </div>
          </div>
        </div>

        <div class="dashboard-panel">
          <div class="panel-header">
            <h3>Query console</h3>
            <span class="panel-pill">Read-only</span>
          </div>
          <form id="databaseQueryForm" class="sheet-form">
            <label>SQL query
              <textarea id="databaseQueryInput" name="sql" placeholder="SELECT * FROM students LIMIT 20"></textarea>
            </label>
            <div class="form-actions">
              <button class="primary-button" type="submit">Run query</button>
            </div>
          </form>
          <div id="databaseQueryResult" class="database-output"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/scripts/auth/auth.js"></script>
  <script src="/scripts/admin/admin-dashboard.js"></script>
  <footer class="dashboard-footer">© 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>
  <script src="/scripts/shared/shared-bindings.js"></script>

  <style>
    /* Database page tiles */
    .database-table-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      align-items: stretch;
      padding: 8px 0 0 0;
    }
    .database-table-list .database-table-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(180deg, #0b1220 0%, #07101a 100%);
      color: #e6eef8;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 20px 12px;
      text-align: center;
      min-height: 96px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.45);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .database-table-list .database-table-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(2,6,23,0.6);
      background: linear-gradient(180deg, rgba(14,20,34,0.98), rgba(8,12,20,0.98));
    }
    .database-table-button .db-icon {
      width: 44px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(24,144,255,0.08);
      color: #2aa6ff;
      border-radius: 8px;
      font-size: 20px;
    }
    .database-table-button strong {
      display: block;
      color: #e6eef8;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .database-table-button span {
      display: block;
      color: rgba(230,238,248,0.6);
      font-size: 0.85rem;
    }
  </style>

</body>
</html>
