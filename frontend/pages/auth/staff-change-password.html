<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change temporary password | CRESENT HIGH SCHOOL</title>
  <link rel="stylesheet" href="/styles/shared/site-common.css">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #142b45; background: #f4f7f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid #dbe4e8; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgba(16, 42, 67, .08); }
    .brand { margin: 0 0 6px; color: #102a43; font-size: .9rem; font-weight: 800; letter-spacing: .04em; }
    .eyebrow { margin: 0 0 8px; color: #267246; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); }
    .intro { color: #52677d; line-height: 1.55; }
    .account { margin: 20px 0; padding: 12px 14px; border: 1px solid #dbe4e8; border-radius: 10px; background: #f8fafb; }
    .account span { display: block; color: #64748b; font-size: .75rem; }
    .account strong { display: block; margin-top: 4px; overflow-wrap: anywhere; }
    form { display: grid; gap: 15px; }
    label { display: grid; gap: 7px; font-size: .9rem; font-weight: 700; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #cbd5df; border-radius: 9px; font: inherit; }
    input:focus { outline: 3px solid rgba(36, 115, 69, .16); border-color: #287548; }
    .password-row { display: flex; gap: 8px; }
    .password-row input { min-width: 0; }
    .password-row button, .secondary { min-height: 44px; padding: 0 12px; border: 1px solid #cbd5df; border-radius: 9px; background: #fff; color: #334e68; font: inherit; cursor: pointer; }
    .requirements { margin: -5px 0 0; color: #52677d; font-size: .82rem; line-height: 1.5; }
    .strength { height: 6px; overflow: hidden; border-radius: 99px; background: #e2e8f0; }
    .strength span { display: block; width: 0; height: 100%; background: #267246; transition: width .15s ease; }
    .message { min-height: 22px; margin: 0; color: #b42318; font-size: .9rem; }
    .message.success { color: #187044; }
    .actions { display: flex; gap: 10px; }
    .submit { flex: 1; min-height: 46px; border: 0; border-radius: 9px; background: #176b3a; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    .submit:disabled { opacity: .65; cursor: wait; }
    @media (max-width: 520px) { main { padding: 24px 18px; } .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <p class="brand"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL PORTAL</p>
    <p class="eyebrow">Account security</p>
    <h1>Set a new password</h1>
    <p class="intro">Your temporary staff password must be replaced before you can use a school portal.</p>
    <div class="account"><span>Signed in as</span><strong id="staffIdentity">Staff account</strong></div>
    <form id="staffPasswordForm" novalidate>
      <label for="currentPassword">Temporary or current password
        <div class="password-row"><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required><button type="button" data-toggle-password="currentPassword" aria-label="Show current password">Show</button></div>
      </label>
      <label for="newPassword">New password
        <div class="password-row"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="passwordRequirements"><button type="button" data-toggle-password="newPassword" aria-label="Show new password">Show</button></div>
      </label>
      <div class="strength" aria-label="Password strength"><span id="strengthBar"></span></div>
      <p id="passwordRequirements" class="requirements">Use at least 12 characters with an uppercase letter, a lowercase letter, a number, and a symbol.</p>
      <label for="confirmPassword">Confirm new password
        <div class="password-row"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><button type="button" data-toggle-password="confirmPassword" aria-label="Show confirmation password">Show</button></div>
      </label>
      <p id="passwordMessage" class="message" role="status" aria-live="polite"></p>
      <div class="actions"><button class="submit" id="changePasswordButton" type="submit">Change password</button><button class="secondary" id="logoutButton" type="button">Log out</button></div>
    </form>
  </main>
  <script src="/scripts/shared/config.js"></script>
  <script src="/scripts/auth/staff-change-password.js"></script>
</body>
</html>
