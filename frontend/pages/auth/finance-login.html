<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Finance Login | CRESENT HIGH SCHOOL</title>
  <link rel="stylesheet" href="//styles/shared/style.css">
  <link rel="stylesheet" href="//styles/shared/site-common.css">
  <link rel="stylesheet" href="//styles/shared/responsive.css">
  <style>
    .finance-login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #062e3f, #0f766e 55%, #d97706); }
    .finance-login-card { width: min(100%, 430px); padding: 36px; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px rgba(2, 44, 57, .28); }
    .finance-login-card h1 { margin: 0 0 8px; color: #123347; }
    .finance-login-card p { color: #5f7180; }
    .finance-login-card .form-field { margin-top: 18px; }
    .finance-login-card input { width: 100%; box-sizing: border-box; }
    .finance-login-card button { width: 100%; margin-top: 22px; }
    .finance-login-status { min-height: 22px; margin: 14px 0 0; color: #b42318; }
    .finance-login-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="finance-login-shell">
    <section class="finance-login-card" aria-labelledby="financeLoginTitle">
      <p class="eyebrow">CRESENT HIGH SCHOOL / FINANCE</p>
      <h1 id="financeLoginTitle">Finance portal</h1>
      <p>Sign in with the finance account assigned by your administrator.</p>
      <form id="financeLoginForm" autocomplete="on">
        <div class="form-field"><label for="financeIdentifier">Username or email</label><input id="financeIdentifier" name="username" autocomplete="username" required></div>
        <div class="form-field"><label for="financePassword">Password</label><input id="financePassword" type="password" name="password" autocomplete="current-password" required></div>
        <button class="auth-button" id="financeLoginButton" type="submit">Sign in</button>
        <p class="finance-login-status" id="financeLoginStatus" aria-live="polite"></p>
      </form>
      <div class="finance-login-links"><a href="admin-login.html">Admin portal</a><a href="login.html">Student portal</a></div>
    </section>
  </main>
  <script src="/scripts/shared/config.js"></script>
  <script src="/finance-login.js"></script>
</body>
</html>
