<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Login | Admin Portal</title>
    <link rel="stylesheet" href="/styles/shared/style.css">
    <link rel="stylesheet" href="/styles/shared/site-common.css">
    <script src="/scripts/shared/config.js"></script>
        <style>
            /* Login page with background image and card positioned left. */
            .auth-shell { min-height: 100vh; display:flex; align-items:center; justify-content:flex-start; padding:2rem 2rem 2rem 5rem; box-sizing:border-box; background-image: url('/assets/images/login-bg.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed; }
            .auth-container { display:flex; width:100%; max-width:420px; background:white; border-radius:8px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.08); }
            .auth-image { display:none; }
            .auth-card { flex:1; padding:2rem; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; }
            .brand-block { margin-bottom:1.25rem; }
            .security-badge { font-size:0.75rem; color:#059669; margin-top:0.5rem; display:flex; align-items:center; gap:0.25rem; }
            .security-badge::before { content:'🔒'; }
            .failed-attempts { font-size:0.85rem; color:#dc2626; margin-top:0.5rem; display:none; }
            @media (max-width:900px) {
                .auth-shell { justify-content:center; padding:2rem; }
                .auth-container { max-width:100%; }
                .auth-card { padding:1.25rem; }
            }
        </style>
  <link rel="stylesheet" href="/styles/shared/responsive.css">
</head>
<body>
        <main class="auth-shell">
            <div class="auth-container">
                <div class="auth-image" aria-hidden="true"></div>
                <section class="auth-card" aria-labelledby="loginTitle">
            <div class="brand-block">
                <div class="brand-mark">C</div>
                <h1 id="loginTitle"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</h1>
                <p>Admin Portal</p>
                <div class="security-badge">Secure Connection</div>
            </div>
            <form class="auth-form" id="adminLoginForm" autocomplete="off">
                <input type="hidden" id="csrfToken" name="csrfToken">
                <div class="form-field">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your admin username" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <div class="form-field">
                    <label><input type="checkbox" id="rememberMe" name="remember"> Remember this device for 7 days</label>
                </div>
                <div class="failed-attempts" id="failedAttempts"></div>
                <button type="submit" class="auth-button" id="loginBtn">Login</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Student Portal</a>
                <a href="support.html">Help & Support</a>
            </div>
        </section>
      </div>
    </main>
    <footer class="auth-footer">&copy; 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>
    <script src="/scripts/shared/site-common.js"></script>
    <script src="/scripts/auth/admin-auth.js"></script>
  <script src="/scripts/shared/shared-bindings.js"></script>
</body>
</html>
