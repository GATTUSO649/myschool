<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Management - Admin Portal</title>
  <link rel="stylesheet" href="site-common.css">`n<link rel="stylesheet" href="dashboard.css">`n<link rel="stylesheet" href="admin-dashboard.css">
</head>
<body class="admin-dashboard-page has-site-footer">
  <header class="dashboard-header">
    <div class="header-content">
      <div style="display:flex;align-items:center;gap:14px">
        <button id="sidebarToggle" class="header-pill" title="Toggle sidebar">☰</button>
        <div class="brand-bar">
          <div class="school-name"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</div>
          <div class="header-note">Student management</div>
        </div>
      </div>
      <div class="header-actions">
        <input id="adminSearch" placeholder="Search modules" style="min-width:260px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff">
        <span class="header-pill" id="adminNamePill">Administrator</span>
        <button class="logout-button" data-admin-logout>Logout</button>
      </div>
    </div>
  </header>

  <div class="student-shell">
    <aside class="student-sidebar"></aside>

    <main class="dashboard-main" id="managementFormRoot">
      <section class="admin-section">
        <section class="module-grid management-card-grid">
          <article class="module-card accent-gold">
            <div class="module-icon" aria-hidden="true"></div>
            <h3>Academics</h3>
            <p>Manage academic tools and resources for Form 1 students.</p>
            <div class="module-actions">
              <a class="sheet-button primary" data-form-link="academics" href="admin-academics.html">Open</a>
            </div>
          </article>

          <article class="module-card accent-teal">
            <div class="module-icon" aria-hidden="true"></div>
            <h3>Finance</h3>
            <p>Manage fee records and finance tools for Form 1 students.</p>
            <div class="module-actions">
              <a class="sheet-button primary" data-form-link="finance" href="admin-finance.html">Open</a>
            </div>
          </article>
        </section>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="admin-modern.js"></script>
  <script src="admin-dashboard.js"></script>
  <footer class="dashboard-footer">© 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>`n  <script src="shared-bindings.js"></script>
</body>
</html>
