<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up | Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="site-common.css">
    <script src="config.js"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="signupTitle">
            <div class="brand-block">
                <div class="brand-mark">C</div>
                <h1 id="signupTitle"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</h1>
                <p>Create your student portal account</p>
            </div>
            <form class="auth-form" id="registerForm">
                <div class="form-field">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" placeholder="Create a username">
                </div>
                <div class="form-field">
                    <label for="regAdmission">Admission number</label>
                    <input type="text" id="regAdmission" name="admissionNumber" placeholder="e.g. CHS01">
                </div>
                <div class="form-field">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" placeholder="Use your admission number">
                </div>
                <div class="form-field">
                    <label for="regConfirm">Confirm password</label>
                    <input type="password" id="regConfirm" name="confirm" placeholder="Confirm your password">
                </div>
                <button type="submit" class="auth-button">Register</button>
            </form>
            <div class="auth-links">
                <a href="application.html">Apply for admission</a>
                <a href="login.html">Already have an account?</a>
            </div>
        </section>
    </main>
    <footer class="auth-footer">&copy; 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>
    <script src="auth.js"></script>
    <script src="site-common.js"></script>
  <script src="shared-bindings.js"></script>
</body>
</html>
