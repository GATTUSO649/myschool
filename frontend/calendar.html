<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - CRESENT HIGH SCHOOL</title>
    <link rel="stylesheet" href="academic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="site-common.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="school-name">CRESENT HIGH SCHOOL</div>
        <nav class="dashboard-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="academic.html">Academics</a>
            <a href="finance.html">Finance</a>
            <a href="exams.html">Exams</a>
            <a href="notifications.html">Notifications</a>
            <a href="clearance-request.html">Clearance & Request</a>
            <a href="lecturer interaction.html">Lecturer Interaction</a>
        </nav>
    </header>



    <main class="profile-main">
        <section class="profile-header">
            <h2><i class="fas fa-calendar-alt"></i> Events</h2>
            <p>Stay updated with important academic dates, events, and deadlines</p>

            <!-- Quick Stats -->
            <div class="calendar-stats">
                <div class="stat-item">
                    <div class="stat-number" id="upcomingEvents">0</div>
                    <div class="stat-label">Upcoming Events</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="thisWeekEvents">0</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="thisMonthEvents">0</div>
                    <div class="stat-label">This Month</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="examCount">0</div>
                    <div class="stat-label">Exams</div>
                </div>
            </div>
        </section>

        <!-- Event Controls -->
        <div class="calendar-controls">
            <div class="calendar-nav">
                <button id="prevMonth" class="nav-btn" title="Previous month" aria-label="Previous month">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <h3 id="currentMonth">Month Year</h3>
                <button id="nextMonth" class="nav-btn" title="Next month" aria-label="Next month">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <div class="view-controls">
                <button class="view-btn active" data-view="month">
                    <i class="fas fa-calendar"></i> Month
                </button>
                <button class="view-btn" data-view="week">
                    <i class="fas fa-calendar-week"></i> Week
                </button>
                <button class="view-btn" data-view="list">
                    <i class="fas fa-list"></i> List
                </button>
            </div>

            <div class="filter-controls">
                <label for="eventFilter" class="visually-hidden">Event filter</label>
                <select id="eventFilter" title="Filter events by type">
                    <option value="all">All Events</option>
                    <option value="exams">Exams Only</option>
                    <option value="assignments">Assignments</option>
                    <option value="holidays">Holidays</option>
                    <option value="events">School Events</option>
                </select>
            </div>
        </div>

        <!-- Events Container and Sidebar -->
        <div class="calendar-layout">
            <div id="calendarContainer" class="calendar-container">
                <!-- Events will be rendered here -->
            </div>

            <div class="upcoming-events">
                <h3>Upcoming Events</h3>
                <div id="upcomingEventsList" class="events-list">
                    <!-- Upcoming events will be populated here -->
                </div>
            </div>
        </div>

        <!-- Event Detail Modal -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="eventModalTitle">Event Details</h2>
                    <button class="modal-close" onclick="closeModal('eventModal')">&times;</button>
                </div>
                <div class="modal-body" id="eventDetails">
                    <!-- Event details will be populated here -->
                </div>
            </div>
        </div>

        <!-- Add Event Modal (for lecturers/admins) -->
        <div id="addEventModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add New Event</h2>
                    <button class="modal-close" onclick="closeModal('addEventModal')">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="addEventForm">
                        <div class="form-group">
                            <label>Event Title *</label>
                            <input type="text" name="title" placeholder="e.g., Mathematics Exam" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventType">Event Type *</label>
                                <select id="eventType" name="type" required title="Select event type">
                                    <option value="">Select Type</option>
                                    <option value="exam">Exam</option>
                                    <option value="assignment">Assignment</option>
                                    <option value="holiday">Holiday</option>
                                    <option value="event">School Event</option>
                                    <option value="meeting">Meeting</option>
                                    <option value="deadline">Deadline</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="eventSubject">Subject (if applicable)</label>
                                <select id="eventSubject" name="subject" title="Select event subject">
                                    <option value="">Select Subject</option>
                                    <option value="mathematics">Mathematics</option>
                                    <option value="english">English</option>
                                    <option value="kiswahili">Kiswahili</option>
                                    <option value="biology">Biology</option>
                                    <option value="chemistry">Chemistry</option>
                                    <option value="physics">Physics</option>
                                    <option value="history">History</option>
                                    <option value="geography">Geography</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Start Date & Time *</label>
                                <input type="datetime-local" name="startDate" required>
                            </div>
                            <div class="form-group">
                                <label>End Date & Time *</label>
                                <input type="datetime-local" name="endDate" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea name="description" rows="3" placeholder="Event description and details..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" name="location" placeholder="e.g., Room 101, Online">
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('addEventModal')">Cancel</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Add Event
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        let currentDate = new Date();
        let currentView = 'month';
        let events = [];
        let selectedEvent = null;

        // Initialize page
        if (!checkAuth()) {
            window.location.href = 'login.html';
        } else {
            const student = getStudentInfo();
            if (student && (student.role === 'lecturer' || student.role === 'rba')) {
                addAdminControls();
            }
            loadEvents();
            renderCalendar();
        }

        async function loadEvents() {
            try {
                const response = await fetchWithAuth('/api/calendar/events');
                if (response.ok) {
                    events = await response.json();
                    updateStats();
                    renderUpcomingEvents();
                    renderCalendar();
                } else {
                    console.error('Failed to load events');
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function updateStats() {
            const now = new Date();
            const weekFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            const monthFromNow = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());

            const upcoming = events.filter(event => new Date(event.start_date) > now);
            const thisWeek = events.filter(event =>
                new Date(event.start_date) >= now && new Date(event.start_date) <= weekFromNow
            );
            const thisMonth = events.filter(event =>
                new Date(event.start_date) >= now && new Date(event.start_date) <= monthFromNow
            );
            const exams = events.filter(event => event.type === 'exam');

            document.getElementById('upcomingEvents').textContent = upcoming.length;
            document.getElementById('thisWeekEvents').textContent = thisWeek.length;
            document.getElementById('thisMonthEvents').textContent = thisMonth.length;
            document.getElementById('examCount').textContent = exams.length;
        }

        function renderCalendar() {
            const container = document.getElementById('calendarContainer');

            if (currentView === 'month') {
                renderMonthView(container);
            } else if (currentView === 'week') {
                renderWeekView(container);
            } else if (currentView === 'list') {
                renderListView(container);
            }
        }

        function renderMonthView(container) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            const endDate = new Date(lastDay);
            endDate.setDate(endDate.getDate() + (6 - lastDay.getDay()));

            let html = `
                <div class="calendar-grid">
                    <div class="calendar-header">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div class="calendar-body">
            `;

            let currentDatePointer = new Date(startDate);

            while (currentDatePointer <= endDate) {
                const dayEvents = getEventsForDate(currentDatePointer);
                const isCurrentMonth = currentDatePointer.getMonth() === month;
                const isToday = isSameDate(currentDatePointer, new Date());

                html += `
                    <div class="calendar-day ${!isCurrentMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" onclick="selectDate('${currentDatePointer.toISOString().split('T')[0]}')">
                        <div class="day-number">${currentDatePointer.getDate()}</div>
                        <div class="day-events">
                            ${dayEvents.slice(0, 3).map(event => `
                                <div class="event-item ${event.type}" onclick="event.preventDefault(); viewEvent(${event.id})">
                                    <span class="event-title">${event.title}</span>
                                </div>
                            `).join('')}
                            ${dayEvents.length > 3 ? `<div class="more-events">+${dayEvents.length - 3} more</div>` : ''}
                        </div>
                    </div>
                `;

                currentDatePointer.setDate(currentDatePointer.getDate() + 1);
            }

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderWeekView(container) {
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());

            let html = `
                <div class="week-view">
                    <div class="week-header">
            `;

            for (let i = 0; i < 7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                const isToday = isSameDate(day, new Date());

                html += `
                    <div class="week-day ${isToday ? 'today' : ''}">
                        <div class="day-name">${day.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                        <div class="day-number">${day.getDate()}</div>
                    </div>
                `;
            }

            html += `
                    </div>
                    <div class="week-body">
            `;

            const hours = Array.from({length: 24}, (_, i) => i);

            hours.forEach(hour => {
                html += `<div class="time-slot">`;

                for (let day = 0; day < 7; day++) {
                    const currentDay = new Date(startOfWeek);
                    currentDay.setDate(startOfWeek.getDate() + day);
                    currentDay.setHours(hour, 0, 0, 0);

                    const hourEvents = getEventsForHour(currentDay);

                    html += `
                        <div class="hour-cell">
                            ${hourEvents.map(event => `
                                <div class="event-item ${event.type}" onclick="viewEvent(${event.id})">
                                    <span class="event-title">${event.title}</span>
                                    <span class="event-time">${formatTime(event.start_date)} - ${formatTime(event.end_date)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                html += `</div>`;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderListView(container) {
            const filter = document.getElementById('eventFilter').value;
            const filteredEvents = events.filter(event => {
                if (filter === 'all') return true;
                return event.type === filter;
            }).sort((a, b) => new Date(a.start_date) - new Date(b.start_date));

            if (filteredEvents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3>No events found</h3>
                        <p>No events match the selected filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="list-view">
                    ${filteredEvents.map(event => `
                        <div class="list-event-item" onclick="viewEvent(${event.id})">
                            <div class="event-icon">
                                <i class="fas ${getEventIcon(event.type)}"></i>
                            </div>
                            <div class="event-info">
                                <h4>${event.title}</h4>
                                <div class="event-meta">
                                    <span class="event-date">${formatDateTime(event.start_date)}</span>
                                    ${event.location ? `<span class="event-location"><i class="fas fa-map-marker-alt"></i> ${event.location}</span>` : ''}
                                </div>
                                ${event.description ? `<p class="event-description">${event.description}</p>` : ''}
                            </div>
                            <div class="event-type-badge ${event.type}">
                                ${event.type.charAt(0).toUpperCase() + event.type.slice(1)}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderUpcomingEvents() {
            const container = document.getElementById('upcomingEventsList');
            const now = new Date();
            const upcoming = events
                .filter(event => new Date(event.start_date) > now)
                .sort((a, b) => new Date(a.start_date) - new Date(b.start_date))
                .slice(0, 5);

            if (upcoming.length === 0) {
                container.innerHTML = `
                    <div class="no-events">
                        <i class="fas fa-calendar-check"></i>
                        <p>No upcoming events</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = upcoming.map(event => `
                <div class="upcoming-event" onclick="viewEvent(${event.id})">
                    <div class="event-icon">
                        <i class="fas ${getEventIcon(event.type)}"></i>
                    </div>
                    <div class="event-details">
                        <h4>${event.title}</h4>
                        <div class="event-time">${formatDateTime(event.start_date)}</div>
                        ${event.location ? `<div class="event-location">${event.location}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getEventsForDate(date) {
            return events.filter(event => {
                const eventDate = new Date(event.start_date);
                return isSameDate(eventDate, date);
            });
        }

        function getEventsForHour(dateTime) {
            return events.filter(event => {
                const eventStart = new Date(event.start_date);
                const eventEnd = new Date(event.end_date);
                return eventStart <= dateTime && eventEnd > dateTime;
            });
        }

        function isSameDate(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                   date1.getMonth() === date2.getMonth() &&
                   date1.getDate() === date2.getDate();
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function getEventIcon(type) {
            const icons = {
                exam: 'fa-graduation-cap',
                assignment: 'fa-tasks',
                holiday: 'fa-umbrella-beach',
                event: 'fa-calendar-star',
                meeting: 'fa-users',
                deadline: 'fa-clock'
            };
            return icons[type] || 'fa-calendar';
        }

        function selectDate(dateString) {
            // Could implement date selection functionality
            console.log('Selected date:', dateString);
        }

        function viewEvent(eventId) {
            selectedEvent = events.find(e => e.id === eventId);
            if (selectedEvent) {
                showEventModal();
            }
        }

        function showEventModal() {
            const modal = document.getElementById('eventModal');
            const details = document.getElementById('eventDetails');

            details.innerHTML = `
                <div class="event-detail">
                    <div class="event-header">
                        <div class="event-icon-large">
                            <i class="fas ${getEventIcon(selectedEvent.type)}"></i>
                        </div>
                        <div class="event-title-section">
                            <h3>${selectedEvent.title}</h3>
                            <span class="event-type-badge ${selectedEvent.type}">
                                ${selectedEvent.type.charAt(0).toUpperCase() + selectedEvent.type.slice(1)}
                            </span>
                        </div>
                    </div>

                    <div class="event-info">
                        <div class="info-item">
                            <i class="fas fa-calendar"></i>
                            <span>${formatDateTime(selectedEvent.start_date)} - ${formatTime(selectedEvent.end_date)}</span>
                        </div>
                        ${selectedEvent.location ? `
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${selectedEvent.location}</span>
                            </div>
                        ` : ''}
                        ${selectedEvent.subject ? `
                            <div class="info-item">
                                <i class="fas fa-book"></i>
                                <span>${selectedEvent.subject.charAt(0).toUpperCase() + selectedEvent.subject.slice(1)}</span>
                            </div>
                        ` : ''}
                    </div>

                    ${selectedEvent.description ? `
                        <div class="event-description">
                            <h4>Description</h4>
                            <p>${selectedEvent.description}</p>
                        </div>
                    ` : ''}
                </div>
            `;

            openModal('eventModal');
        }

        function addAdminControls() {
            const controls = document.querySelector('.calendar-controls');
            const addButton = document.createElement('button');
            addButton.className = 'btn btn-primary';
            addButton.innerHTML = '<i class="fas fa-plus"></i> Add Event';
            addButton.onclick = () => openModal('addEventModal');
            controls.appendChild(addButton);
        }

        // Event listeners
        document.getElementById('prevMonth').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            renderCalendar();
        });

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                renderCalendar();
            });
        });

        document.getElementById('eventFilter').addEventListener('change', function() {
            if (currentView === 'list') {
                renderCalendar();
            }
        });

        document.getElementById('addEventForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const eventData = {
                title: formData.get('title'),
                type: formData.get('type'),
                subject: formData.get('subject'),
                start_date: formData.get('startDate'),
                end_date: formData.get('endDate'),
                description: formData.get('description'),
                location: formData.get('location')
            };

            try {
                const response = await fetchWithAuth('/api/calendar/events', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                });

                if (response.ok) {
                    alert('Event added successfully!');
                    closeModal('addEventModal');
                    this.reset();
                    loadEvents();
                } else {
                    const error = await response.json();
                    alert('Failed to add event: ' + (error.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error adding event:', error);
                alert('Failed to add event. Please try again.');
            }
        });

        function updateMonthDisplay() {
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('currentMonth').textContent =
                `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        }

        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const hamburger = document.getElementById('hamburger');
            sideMenu.classList.toggle('active');
            hamburger.classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('student');
            localStorage.removeItem('rememberMe');
            window.location.href = 'login.html';
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Initialize month display
        updateMonthDisplay();
    </script>
