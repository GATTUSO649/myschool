<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT Login | CRESENT HIGH SCHOOL</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/site-common.css"><link rel="stylesheet" href="/responsive.css">
  <style>
    .ict-login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #102a43, #1d4ed8 58%, #0f766e); }
    .ict-login-card { width: min(100%, 430px); padding: 36px; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px rgba(16,42,67,.28); }
    .ict-login-card h1 { margin: 0 0 8px; color: #102a43; }.ict-login-card p { color: #627d98; }
    .ict-login-card .form-field { margin-top: 18px; }.ict-login-card input { width: 100%; box-sizing: border-box; }.ict-login-card button { width: 100%; margin-top: 22px; }
    .ict-login-status { min-height: 22px; margin-top: 14px; color: #b42318; }.ict-login-links { display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.9rem; }
  </style>
</head>
<body><main class="ict-login-shell"><section class="ict-login-card"><p class="eyebrow">CRESENT HIGH SCHOOL / ICT</p><h1>ICT portal</h1><p>Sign in with the ICT account assigned by the administrator.</p><form id="ictLoginForm"><div class="form-field"><label for="ictIdentifier">Username or email</label><input id="ictIdentifier" name="username" autocomplete="username" required></div><div class="form-field"><label for="ictPassword">Password</label><input id="ictPassword" type="password" name="password" autocomplete="current-password" required></div><button class="auth-button" id="ictLoginButton" type="submit">Sign in</button><p class="ict-login-status" id="ictLoginStatus" aria-live="polite"></p></form><div class="ict-login-links"><a href="staff-portals.html">Staff portals</a><a href="admin-login.html">Admin portal</a></div></section></main><script src="config.js"></script><script src="ict-login.js"></script></body>
</html>
