<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login | Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
        <style>
            .login-container {
                background: #1a3a52;
                border-radius: 16px;
                box-shadow: 0 80px 32px 0 rgba(6, 21, 231, 0.822);
                padding: 40px 32px;
                width: 350px;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 40px auto 0 auto;
            }
            .login-container > div[style*="text-align:center"] {
                margin-bottom: 8px !important;
            }
            .login-form h2 {
                margin-bottom: 18px;
                color: #c2cbda;
                letter-spacing: 1px;
            }
            .input-group {
                width: 100%;
                margin-bottom: 18px;
            }
            .input-group label {
                display: block;
                margin-bottom: 6px;
                color: #e0e2f1;
                font-weight: 500;
            }
            .input-group input[type="text"], .input-group input[type="password"] {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                font-size: 16px;
                background: #f7f9fa;
                transition: border 0.2s;
            }
            .input-group input:focus {
                border: 1.5px solid #2575fc;
                outline: none;
            }
            .login-btn {
                width: 100%;
                padding: 12px;
                background: linear-gradient(90deg, #1565c0 0%, #1a237e 100%);
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 10px;
                transition: background 0.2s;
            }
            .login-btn:hover { background: linear-gradient(90deg, #1a237e 0%, #1565c0 100%); }
            .portal-links { margin-top: 18px; font-size: 15px; color: #888; }
            .portal-links a { color: #2575fc; text-decoration: none; font-weight: 500; }
            .portal-links a:hover { text-decoration: underline; }
            .portal-footer {
                margin-top: auto;
                background: none;
                text-align: center;
                color: #fff;
                font-size: 16px;
                padding: 16px 0 8px 0;
            }
        </style>
  <link rel="stylesheet" href="site-common.css">
</head>
<body>
    <div class="login-container">
        <div class="portal-header">
            <h1><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</h1>
            <p>Student Portal</p>
        </div>
        <form class="login-form" id="loginForm">
            <h2>Login</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Your Username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Your Admission Number">
            </div>
            <div class="input-group">
                <label>
                    <input type="checkbox" id="rememberMe" name="remember"> Remember me
                </label>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p class="portal-links">Not admitted yet? <a href="application.html">Apply</a></p>
            <p class="portal-links">Approved already? <a href="signup.html">Create Account</a></p>
        </form>
    </div>
    <footer class="portal-footer">
        &copy; 2026 CRESENT HIGH SCHOOL. All rights reserved.
    </footer>
    <script src="auth.js"></script>
      <script src="site-common.js"></script>
</body>
</html>
