<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Portal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/site-common.css">
    <script src="/config.js"></script>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="loginTitle">
            <div class="brand-block">
                <div class="brand-mark">C</div>
                <h1 id="loginTitle"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</h1>
                <p>Secure student portal access</p>
            </div>
            <form class="auth-form" id="loginForm">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your admission number">
                </div>
                <div class="form-field">
                    <label><input type="checkbox" id="rememberMe" name="remember"> Remember me</label>
                </div>
                <button type="submit" class="auth-button">Login</button>
            </form>
            <div class="auth-links">
                <a href="application.html">Apply for admission</a>
                <a href="signup.html">Create account</a>
            </div>
        </section>
    </main>
    <footer class="auth-footer">&copy; 2026 CRESENT HIGH SCHOOL. All rights reserved.</footer>
    <script src="/auth.js"></script>
    <script src="/site-common.js"></script>
</body>
</html>
