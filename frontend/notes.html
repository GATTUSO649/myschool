<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Notes - CRESENT HIGH SCHOOL</title>
    <link rel="stylesheet" href="academic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="site-common.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <div class="school-name"><span class="cresent-brand">CRESENT</span> HIGH SCHOOL</div>
            <div class="header-actions">
                <span class="header-pill">Student Portal</span>
                <button class="logout-button" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <main class="profile-main">
        <section class="profile-header">
            <h2><i class="fas fa-book"></i> Lecture Notes</h2>
            <p>Access and download comprehensive lecture notes organized by subject and topic</p>

            <!-- Quick Stats -->
            <div class="notes-stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalNotes">0</div>
                    <div class="stat-label">Total Notes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="thisWeekNotes">0</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="subjectsCount">0</div>
                    <div class="stat-label">Subjects</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="downloadsCount">0</div>
                    <div class="stat-label">Downloads</div>
                </div>
            </div>
        </section>

        <!-- Search and Filter Bar -->
        <div class="filter-section">
            <div class="filter-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="notesSearch" placeholder="Search notes by title, subject, or topic...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="recent">Recent</button>
                    <button class="filter-btn" data-filter="downloaded">Downloaded</button>
                    <button class="filter-btn" data-filter="favorites">Favorites</button>
                </div>
                <div class="view-controls">
                    <button class="view-btn active" data-view="grid" title="Grid View">
                        <i class="fas fa-th"></i>
                    </button>
                    <button class="view-btn" data-view="list" title="List View">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <!-- Subject Filter -->
            <div class="subject-filter">
                <label for="subjectFilter">Filter by Subject:</label>
                <select id="subjectFilter" aria-label="Filter notes by subject">
                    <option value="all">All Subjects</option>
                </select>
            </div>
        </div>

        <!-- Notes Container -->
        <div id="notesContainer" class="notes-container">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading lecture notes...</p>
            </div>
        </div>

        <!-- Upload Section for Lecturers/Admins -->
        <div id="uploadSection" class="upload-section hidden">
            <div class="upload-card">
                <h3><i class="fas fa-upload"></i> Upload New Notes</h3>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="noteTitle">Title *</label>
                        <input type="text" id="noteTitle" name="title" placeholder="e.g., Introduction to Algebra" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="noteSubject">Subject *</label>
                            <select id="noteSubject" name="subject" required>
                                <option value="">Select Subject</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="English">English</option>
                                <option value="Kiswahili">Kiswahili</option>
                                <option value="Science">Science</option>
                                <option value="Social Studies">Social Studies</option>
                                <option value="CRE">CRE</option>
                                <option value="Geography">Geography</option>
                                <option value="History">History</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="Computer Studies">Computer Studies</option>
                                <option value="Business Studies">Business Studies</option>
                                <option value="Agriculture">Agriculture</option>
                                <option value="Art">Art</option>
                                <option value="Music">Music</option>
                                <option value="Physical Education">Physical Education</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="noteClass">Class/Grade *</label>
                            <select id="noteClass" name="class" required>
                                <option value="">Select Class</option>
                                <option value="Grade 1">Grade 1</option>
                                <option value="Grade 2">Grade 2</option>
                                <option value="Grade 3">Grade 3</option>
                                <option value="Grade 4">Grade 4</option>
                                <option value="Grade 5">Grade 5</option>
                                <option value="Grade 6">Grade 6</option>
                                <option value="Grade 7">Grade 7</option>
                                <option value="Grade 8">Grade 8</option>
                                <option value="Form 1">Form 1</option>
                                <option value="Form 2">Form 2</option>
                                <option value="Form 3">Form 3</option>
                                <option value="Form 4">Form 4</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="noteTopic">Topic/Chapter</label>
                        <input type="text" id="noteTopic" name="topic" placeholder="e.g., Chapter 5: Quadratic Equations">
                    </div>

                    <div class="form-group">
                        <label for="noteDescription">Description</label>
                        <textarea id="noteDescription" name="description" placeholder="Brief description of the notes content..." rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="noteFile">File *</label>
                        <input type="file" id="noteFile" name="file" accept="application/pdf,.doc,.docx,.ppt,.pptx" required>
                        <small class="file-hint">Supported formats: PDF, DOC, DOCX, PPT, PPTX (Max 10MB)</small>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="cancelUpload()">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload"></i> Upload Notes
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Note Detail Modal -->
        <div id="noteModal" class="modal">
            <div class="modal-content large-modal">
                <div class="modal-header">
                    <h2 id="noteModalTitle">Note Details</h2>
                    <button class="modal-close" onclick="closeModal('noteModal')">&times;</button>
                </div>
                <div class="modal-body" id="noteDetails">
                    <!-- Note details will be populated here -->
                </div>
            </div>
        </div>

        <!-- Quick Actions FAB -->
        <div class="fab-container">
            <button class="fab-main" id="fabMain" onclick="toggleFAB()">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fabMenu">
                <button class="fab-item" onclick="showUploadSection()" title="Upload Notes">
                    <i class="fas fa-upload"></i>
                </button>
                <button class="fab-item" onclick="refreshNotes()" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="fab-item" onclick="showFavorites()" title="Favorites">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="site-common.js"></script>
    <script>
        let notes = [];
        let currentFilter = 'all';
        let currentView = 'grid';
        let currentSubject = 'all';
        let userRole = 'student';

        // Initialize page
        if (!checkAuth()) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(localStorage.getItem('student') || '{}');
            userRole = user.role || 'student';
            if (userRole === 'lecturer' || userRole === 'rba') {
                document.getElementById('uploadSection').style.display = 'block';
                document.querySelector('.fab-container').style.display = 'block';
            }
            loadNotes();
        }

        async function loadNotes() {
            try {
                const response = await fetchWithAuth('/api/notes');
                if (response.ok) {
                    notes = await response.json();
                    updateStats();
                    populateSubjectFilter();
                    renderNotes();
                } else {
                    showError('Failed to load notes');
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                showError('Error loading notes');
            }
        }

        function updateStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            let totalNotes = notes.length;
            let thisWeekNotes = notes.filter(note => new Date(note.upload_date) > weekAgo).length;
            let subjects = new Set(notes.map(note => note.subject)).size;
            let downloadsCount = notes.reduce((sum, note) => sum + (note.downloads || 0), 0);

            document.getElementById('totalNotes').textContent = totalNotes;
            document.getElementById('thisWeekNotes').textContent = thisWeekNotes;
            document.getElementById('subjectsCount').textContent = subjects;
            document.getElementById('downloadsCount').textContent = downloadsCount;
        }

        function populateSubjectFilter() {
            const subjectFilter = document.getElementById('subjectFilter');
            const subjects = [...new Set(notes.map(note => note.subject))].sort();

            subjectFilter.innerHTML = '<option value="all">All Subjects</option>';
            subjects.forEach(subject => {
                subjectFilter.innerHTML += `<option value="${subject}">${subject}</option>`;
            });
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            const filteredNotes = filterNotes(notes);

            if (filteredNotes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book"></i>
                        <h3>No notes found</h3>
                        <p>${getEmptyMessage()}</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                container.innerHTML = `
                    <div class="notes-grid">
                        ${filteredNotes.map(note => `
                            <div class="note-card" onclick="viewNote(${note.id})">
                                <div class="note-header">
                                    <div class="note-icon">
                                        <i class="fas ${getSubjectIcon(note.subject)}"></i>
                                    </div>
                                    <div class="note-actions">
                                        <button class="action-btn favorite ${isFavorite(note.id) ? 'active' : ''}"
                                                onclick="event.stopPropagation(); toggleFavorite(${note.id})"
                                                title="Add to favorites">
                                            <i class="fas fa-heart"></i>
                                        </button>
                                        <button class="action-btn download"
                                                onclick="event.stopPropagation(); downloadNote(${note.id})"
                                                title="Download">
                                            <i class="fas fa-download"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="note-content">
                                    <h4 class="note-title">${note.title}</h4>
                                    <div class="note-meta">
                                        <span class="subject">${note.subject}</span>
                                        <span class="class">${note.class}</span>
                                    </div>
                                    ${note.topic ? `<div class="note-topic">${note.topic}</div>` : ''}
                                    <div class="note-stats">
                                        <span><i class="fas fa-calendar"></i> ${formatDate(note.upload_date)}</span>
                                        <span><i class="fas fa-download"></i> ${note.downloads || 0}</span>
                                        <span><i class="fas fa-file"></i> ${getFileSize(note.file_size)}</span>
                                    </div>
                                </div>

                                <div class="note-footer">
                                    <span class="lecturer">By ${note.lecturer_name || 'Unknown'}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="notes-list">
                        ${filteredNotes.map(note => `
                            <div class="note-list-item" onclick="viewNote(${note.id})">
                                <div class="note-list-icon">
                                    <i class="fas ${getSubjectIcon(note.subject)}"></i>
                                </div>
                                <div class="note-list-content">
                                    <div class="note-list-header">
                                        <h4>${note.title}</h4>
                                        <div class="note-list-actions">
                                            <button class="action-btn favorite ${isFavorite(note.id) ? 'active' : ''}"
                                                    onclick="event.stopPropagation(); toggleFavorite(${note.id})">
                                                <i class="fas fa-heart"></i>
                                            </button>
                                            <button class="action-btn download"
                                                    onclick="event.stopPropagation(); downloadNote(${note.id})">
                                                <i class="fas fa-download"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="note-list-meta">
                                        <span class="subject">${note.subject}</span>
                                        <span class="class">${note.class}</span>
                                        ${note.topic ? `<span class="topic">${note.topic}</span>` : ''}
                                        <span class="date">${formatDate(note.upload_date)}</span>
                                        <span class="downloads">${note.downloads || 0} downloads</span>
                                        <span class="size">${getFileSize(note.file_size)}</span>
                                    </div>
                                    ${note.description ? `<div class="note-list-description">${note.description}</div>` : ''}
                                    <div class="note-list-footer">
                                        <span class="lecturer">Uploaded by ${note.lecturer_name || 'Unknown'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        function filterNotes(notes) {
            return notes.filter(note => {
                // Text search
                const searchTerm = document.getElementById('notesSearch').value.toLowerCase();
                const matchesSearch = !searchTerm ||
                    note.title.toLowerCase().includes(searchTerm) ||
                    note.subject.toLowerCase().includes(searchTerm) ||
                    (note.topic && note.topic.toLowerCase().includes(searchTerm)) ||
                    (note.description && note.description.toLowerCase().includes(searchTerm));

                // Subject filter
                const matchesSubject = currentSubject === 'all' || note.subject === currentSubject;

                // Category filter
                let matchesFilter = true;
                switch (currentFilter) {
                    case 'recent':
                        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
                        matchesFilter = new Date(note.upload_date) > weekAgo;
                        break;
                    case 'downloaded':
                        matchesFilter = (note.downloads || 0) > 0;
                        break;
                    case 'favorites':
                        matchesFilter = isFavorite(note.id);
                        break;
                }

                return matchesSearch && matchesSubject && matchesFilter;
            });
        }

        function getSubjectIcon(subject) {
            const icons = {
                'Mathematics': 'fa-calculator',
                'English': 'fa-book-open',
                'Kiswahili': 'fa-language',
                'Science': 'fa-flask',
                'Physics': 'fa-atom',
                'Chemistry': 'fa-vial',
                'Biology': 'fa-dna',
                'Geography': 'fa-globe',
                'History': 'fa-landmark',
                'Computer Studies': 'fa-computer',
                'Business Studies': 'fa-briefcase',
                'Agriculture': 'fa-seedling',
                'Art': 'fa-palette',
                'Music': 'fa-music',
                'Physical Education': 'fa-running'
            };
            return icons[subject] || 'fa-book';
        }

        function getEmptyMessage() {
            switch (currentFilter) {
                case 'recent': return 'No new notes this week.';
                case 'downloaded': return 'No downloaded notes yet.';
                case 'favorites': return 'No favorite notes yet.';
                default: return 'No notes available for the selected criteria.';
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function getFileSize(bytes) {
            if (!bytes) return 'N/A';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function isFavorite(noteId) {
            const favorites = JSON.parse(localStorage.getItem('noteFavorites') || '[]');
            return favorites.includes(noteId);
        }

        function toggleFavorite(noteId) {
            const favorites = JSON.parse(localStorage.getItem('noteFavorites') || '[]');
            const index = favorites.indexOf(noteId);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(noteId);
            }

            localStorage.setItem('noteFavorites', JSON.stringify(favorites));
            renderNotes();
        }

        async function downloadNote(noteId) {
            try {
                const response = await fetchWithAuth(`/api/notes/${noteId}/download`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const note = notes.find(n => n.id === noteId);
                    a.download = note ? note.filename : `note_${noteId}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    // Update download count
                    note.downloads = (note.downloads || 0) + 1;
                    updateStats();
                } else {
                    alert('Failed to download note');
                }
            } catch (error) {
                console.error('Error downloading note:', error);
                alert('Failed to download note');
            }
        }

        function viewNote(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (note) {
                showNoteModal(note);
            }
        }

        function showNoteModal(note) {
            const modal = document.getElementById('noteModal');
            const title = document.getElementById('noteModalTitle');
            const details = document.getElementById('noteDetails');

            title.textContent = note.title;

            details.innerHTML = `
                <div class="note-detail">
                    <div class="note-detail-header">
                        <div class="note-detail-icon">
                            <i class="fas ${getSubjectIcon(note.subject)}"></i>
                        </div>
                        <div class="note-detail-meta">
                            <h3>${note.title}</h3>
                            <div class="meta-tags">
                                <span class="tag subject">${note.subject}</span>
                                <span class="tag class">${note.class}</span>
                                ${note.topic ? `<span class="tag topic">${note.topic}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="note-detail-content">
                        ${note.description ? `
                            <div class="note-description">
                                <h4>Description</h4>
                                <p>${note.description}</p>
                            </div>
                        ` : ''}

                        <div class="note-info-grid">
                            <div class="info-item">
                                <span class="label">Subject:</span>
                                <span class="value">${note.subject}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Class:</span>
                                <span class="value">${note.class}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Uploaded:</span>
                                <span class="value">${formatDate(note.upload_date)}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Downloads:</span>
                                <span class="value">${note.downloads || 0}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">File Size:</span>
                                <span class="value">${getFileSize(note.file_size)}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Lecturer:</span>
                                <span class="value">${note.lecturer_name || 'Unknown'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="note-detail-actions">
                        <button class="btn btn-primary" onclick="downloadNote(${note.id})">
                            <i class="fas fa-download"></i> Download Notes
                        </button>
                        <button class="btn btn-secondary" onclick="toggleFavorite(${note.id})">
                            <i class="fas fa-heart ${isFavorite(note.id) ? '' : 'far'}"></i>
                            ${isFavorite(note.id) ? 'Remove from Favorites' : 'Add to Favorites'}
                        </button>
                        ${userRole === 'lecturer' || userRole === 'rba' ? `
                            <button class="btn btn-danger" onclick="deleteNote(${note.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;

            openModal('noteModal');
        }

        async function deleteNote(noteId) {
            if (!confirm('Are you sure you want to delete this note?')) return;

            try {
                const response = await fetchWithAuth(`/api/notes/${noteId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    notes = notes.filter(note => note.id !== noteId);
                    updateStats();
                    renderNotes();
                    closeModal('noteModal');
                    alert('Note deleted successfully');
                } else {
                    alert('Failed to delete note');
                }
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('Failed to delete note');
            }
        }

        // Upload functionality
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('title', document.getElementById('noteTitle').value);
            formData.append('subject', document.getElementById('noteSubject').value);
            formData.append('class', document.getElementById('noteClass').value);
            formData.append('topic', document.getElementById('noteTopic').value);
            formData.append('description', document.getElementById('noteDescription').value);
            formData.append('file', document.getElementById('noteFile').files[0]);

            try {
                const response = await fetchWithAuth('/api/notes/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const newNote = await response.json();
                    notes.unshift(newNote);
                    updateStats();
                    populateSubjectFilter();
                    renderNotes();
                    cancelUpload();
                    alert('Notes uploaded successfully!');
                } else {
                    alert('Failed to upload notes');
                }
            } catch (error) {
                console.error('Error uploading notes:', error);
                alert('Failed to upload notes');
            }
        });

        function showUploadSection() {
            document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('noteTitle').focus();
        }

        function cancelUpload() {
            document.getElementById('uploadForm').reset();
            document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function refreshNotes() {
            loadNotes();
        }

        function showFavorites() {
            currentFilter = 'favorites';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === 'favorites');
            });
            renderNotes();
        }

        // Search functionality
        document.getElementById('notesSearch').addEventListener('input', function() {
            renderNotes();
        });

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderNotes();
            });
        });

        // Subject filter
        document.getElementById('subjectFilter').addEventListener('change', function() {
            currentSubject = this.value;
            renderNotes();
        });

        // View toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                renderNotes();
            });
        });

        // FAB functionality
        function toggleFAB() {
            const fabMenu = document.getElementById('fabMenu');
            fabMenu.classList.toggle('active');
        }

        function showError(message) {
            const container = document.getElementById('notesContainer');
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Error Loading Notes</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadNotes()">Try Again</button>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('student');
            localStorage.removeItem('rememberMe');
            window.location.href = 'login.html';
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

    <style>
        .notes-stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }

        .stat-item {
            text-align: center;
            background: rgba(255,255,255,0.9);
            padding: 15px;
